[project]
name = "conformal-viper-artifact"
version = "0.1.0"
description = "Figure-generation scripts and data for the conformal Viper artifact"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "seaborn>=0.13.2",
    "numpy>=1.26",
    "agentdojo==0.1.34",

    "async-lru>=2.0",
    "datasets>=3.0",
    "frozendict>=2.4",
    "pillow>=10.0",
    "termcolor>=2.5",
    "tqdm>=4.66",
    "typeguard>=4.3",
    "word2number>=1.1",
    "openai>=1.61,<2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]

record = [
    "torch>=2",
    "transformers>=4.51,<5",
    "concurrent-openai>=1.2",
    "scipy>=1.15",
]

[tool.uv]
package = false
